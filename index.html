<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis Finanzas</title>
<meta name="theme-color" content="#14532d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body{font-family:'Figtree',system-ui,sans-serif;background:#f3f1ec;color:#1c2b22;padding-top:env(safe-area-inset-top)}
  .num{font-family:'Bricolage Grotesque','Figtree',sans-serif;font-variant-numeric:tabular-nums}
  .btn{display:flex;align-items:center;justify-content:center;gap:.5rem;border-radius:1rem;font-weight:600;padding:.9rem 1.1rem;transition:transform .1s}
  .btn:active{transform:scale(.97)}
  .inp{width:100%;border:1.5px solid #d9d5c9;background:#fff;border-radius:.9rem;padding:.8rem 1rem;font-size:1rem;outline:none}
  .inp:focus{border-color:#14532d;box-shadow:0 0 0 3px #14532d22}
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  @media (prefers-reduced-motion:reduce){.sheet{animation:none}}
  /* Pantalla de carga y rescate: CSS puro, no depende de Tailwind */
  #boot,.rescue{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:100vh;padding:24px;text-align:center;font-family:system-ui,sans-serif;color:#14532d}
  .spin{width:38px;height:38px;border:4px solid #14532d33;border-top-color:#14532d;border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .rescue h1{font-size:1.4rem;color:#1c2b22;margin:0}.rescue p{color:#5b6b61;margin:0}
  .rescue button{width:100%;max-width:340px;padding:22px;font-size:1.25rem;font-weight:700;color:#fff;background:#14532d;border:0;border-radius:20px}
  @media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
</style>
</head>
<body>
<div id="app" class="max-w-md mx-auto min-h-screen">
  <div id="boot" role="status"><div class="spin"></div><p>Cargando Mis Finanzas...</p></div>
</div>
<div id="modal"></div>
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-28 bg-neutral-900 text-white text-sm rounded-full px-4 py-2 opacity-0 pointer-events-none transition-opacity z-[60]"></div>
<script type="module" src="app.js"></script>
<!-- Salvavidas: script clásico (no módulo), independiente de los CDN -->
<script>
(function () {
  setTimeout(function () {
    if (window.appLoaded === true) return;
    var app = document.getElementById('app'); if (!app) return;
    app.innerHTML = '<div class="rescue"><h1>Problema al cargar la aplicación</h1>' +
      '<p>No se han podido descargar algunos recursos. Pulsa el botón para limpiar la caché y reintentar.</p>' +
      '<button id="force" type="button">Forzar recarga</button></div>';
    document.getElementById('force').onclick = async function () {
      this.textContent = 'Limpiando…';
      try {
        if ('serviceWorker' in navigator) { var rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(function (r) { return r.unregister(); })); }
        if (window.caches) { var ks = await caches.keys(); await Promise.all(ks.map(function (k) { return caches.delete(k); })); }
      } catch (e) {}
      window.location.reload(true);
    };
  }, 5000);
})();
</script>
</body>
</html>
